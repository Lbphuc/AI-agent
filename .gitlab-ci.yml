stages:
  - test
  - build
  - deploy

variables:
  # Tối ưu đường dẫn cache pip
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# ------------------------------------------------------------------------------
# STAGE: TEST
# ------------------------------------------------------------------------------

# Kiểm thử Backend Python (134 test cases)
test-backend:
  stage: test
  image: python:3.11-slim
  variables:
    PYTHONPATH: "."
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - pytest -v
  cache:
    key: "python-deps-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip

# Kiểm tra biên dịch TypeScript cho Frontend React
test-frontend:
  stage: test
  image: node:20-slim
  before_script:
    - cd frontend
    - npm install --legacy-peer-deps
  script:
    - npm run build
  cache:
    key: "frontend-deps-$CI_COMMIT_REF_SLUG"
    paths:
      - frontend/node_modules/

# ------------------------------------------------------------------------------
# STAGE: BUILD
# ------------------------------------------------------------------------------

# Đóng gói và đẩy Docker Image bằng Kaniko
# Giải quyết triệt để 2 vấn đề:
# 1. Không cần đặc quyền root/privileged trên runner (tránh lỗi permission denied dind)
# 2. Hỗ trợ đẩy lên Registry chạy HTTP thường (--insecure --skip-tls-verify)
build-image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_JOB_TOKEN}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      --destination "${CI_REGISTRY_IMAGE}:latest"
      --insecure
      --skip-tls-verify
  rules:
    # Tự động build khi push vào nhánh chính (main/master)
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
    # Cho phép kích hoạt thủ công trên các nhánh phát triển khác
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true

# ------------------------------------------------------------------------------
# STAGE: DEPLOY
# ------------------------------------------------------------------------------

# Job triển khai mẫu (kích hoạt thủ công khi sẵn sàng đưa lên server)
deploy-production:
  stage: deploy
  image: alpine:latest
  before_script:
    # 1. Cài đặt OpenSSH client
    - apk add --no-cache openssh-client
    # 2. Khởi động ssh-agent và nạp khóa bí mật
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    # 3. Quét và lưu fingerprint của máy ai-agent vào known_hosts
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    # 4. Kết nối từ xa để kéo image và cập nhật container
    - |
      ssh $DEPLOY_USER@$DEPLOY_HOST "
        echo '${CI_JOB_TOKEN}' | docker login ${CI_REGISTRY} -u ${CI_REGISTRY_USER} --password-stdin || true
        docker pull ${CI_REGISTRY_IMAGE}:latest
        docker stop ai-agent-app || true
        docker rm ai-agent-app || true
        docker run -d --name ai-agent-app -p 8000:8000 -e GEMINI_API_KEY='${GEMINI_API_KEY}' --restart unless-stopped ${CI_REGISTRY_IMAGE}:latest
      "
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
      when: manual