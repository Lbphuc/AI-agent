stages:
  - test
  - build
  - deploy

variables:
  # Tối ưu đường dẫn cache pip
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# ------------------------------------------------------------------------------
# STAGE: TEST
# ------------------------------------------------------------------------------

# Kiểm thử Backend Python (134 test cases)
test-backend:
  stage: test
  image: python:3.11-slim
  variables:
    PYTHONPATH: "."
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - pytest -v
  cache:
    key: "python-deps-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip

# Kiểm tra biên dịch TypeScript cho Frontend React
test-frontend:
  stage: test
  image: node:20-slim
  before_script:
    - cd frontend
    - npm install --legacy-peer-deps
  script:
    - npm run build
  cache:
    key: "frontend-deps-$CI_COMMIT_REF_SLUG"
    paths:
      - frontend/node_modules/

# ------------------------------------------------------------------------------
# STAGE: BUILD
# ------------------------------------------------------------------------------

# Đóng gói và đẩy Docker Image bằng Kaniko
# Giải quyết triệt để 2 vấn đề:
# 1. Không cần đặc quyền root/privileged trên runner (tránh lỗi permission denied dind)
# 2. Hỗ trợ đẩy lên Registry chạy HTTP thường (--insecure --skip-tls-verify)
build-image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_JOB_TOKEN}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      --destination "${CI_REGISTRY_IMAGE}:latest"
      --insecure
      --skip-tls-verify
  rules:
    # Tự động build khi push vào nhánh chính (main/master)
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
    # Cho phép kích hoạt thủ công trên các nhánh phát triển khác
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true

# ------------------------------------------------------------------------------
# STAGE: DEPLOY
# ------------------------------------------------------------------------------

# Job triển khai mẫu (kích hoạt thủ công khi sẵn sàng đưa lên server)
deploy-production:
  stage: deploy
  image: alpine:latest
  script:
    - 'echo "Trien khai phien ban $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA..."'
    - 'echo "Chay container: docker run -d -p 8000:8000 --env-file .env $CI_REGISTRY_IMAGE:latest"'
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
      when: manual